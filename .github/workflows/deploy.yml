name: Deploy Render

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Secret RENDER_DEPLOY_HOOK manquant"; exit 1; }
          case "$RENDER_DEPLOY_HOOK" in
            https://api.render.com/deploy/*) ;;
            *) echo "URL invalide : ce n'est pas un Deploy Hook Render"; exit 1 ;;
          esac
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" | head -c 300
