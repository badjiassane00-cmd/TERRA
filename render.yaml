services:
  - type: web
    name: terra-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run prisma:generate && node scripts/render-migrate.mjs && npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MEDIA_S3_ENDPOINT
        sync: false
      - key: MEDIA_S3_REGION
        value: eu-central-1
      - key: MEDIA_S3_BUCKET
        value: terra-media
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false
      - key: MEDIA_S3_FORCE_PATH_STYLE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: badjiassane00@gmail.com
      - key: PLANTNET_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.7-flash
      - key: BIOCLIP_API_URL
        sync: false
